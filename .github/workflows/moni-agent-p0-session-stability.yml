name: MONI Agent P0 Session Stability

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/moni-agent-p0-session-stability.yml'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/moni-session-toolchain-p0
          fetch-depth: 0

      - name: Wire request lease and frontend idempotency
        run: |
          python - <<'PY'
          from pathlib import Path

          route_path = Path('src/app/api/moni/agent-runtime/route.ts')
          route = route_path.read_text()

          route = route.replace(
            "import { Buffer } from 'node:buffer'\n",
            "import { Buffer } from 'node:buffer'\nimport { randomUUID } from 'node:crypto'\n",
            1,
          )
          route = route.replace(
            "import { reportPmoEvent } from '@/lib/moni/agent/pmo'\n",
            "import { reportPmoEvent } from '@/lib/moni/agent/pmo'\nimport { claimAgentRequest, finishAgentRequest } from '@/lib/moni/agent/request-lease'\n",
            1,
          )
          route = route.replace(
            "export const dynamic = 'force-dynamic'\n",
            "export const dynamic = 'force-dynamic'\nexport const maxDuration = 60\n",
            1,
          )
          route = route.replace(
            "  attachment_ids?: string[]\n}",
            "  attachment_ids?: string[]\n  client_request_id?: string\n}",
            1,
          )
          old_post = """export async function POST(request: NextRequest) {
            const legacyRequest = new NextRequest(request.clone())
            try {"""
          new_post = """export async function POST(request: NextRequest) {
            const legacyRequest = new NextRequest(request.clone())
            let requestTracker: { supabase: SupabaseClient; requestId: string } | null = null
            try {"""
          if old_post not in route:
            raise SystemExit('POST tracker marker not found')
          route = route.replace(old_post, new_post, 1)

          claim_marker = """    assertSafeUserRequest(message)

            const { data: userMessage, error: userMessageError } = await supabase"""
          claim_block = """    assertSafeUserRequest(message)

            const clientRequestId = text(body.client_request_id, 120) || randomUUID()
            const requestClaim = await claimAgentRequest({
              supabase,
              businessId: BUSINESS_ID,
              threadId: thread.id,
              clientRequestId,
              ttlSeconds: 120,
            })
            if (requestClaim.claim_status === 'REPLAY' && requestClaim.response_json) {
              return NextResponse.json({ ...requestClaim.response_json, idempotent_replay: true })
            }
            if (requestClaim.claim_status === 'IN_PROGRESS' || requestClaim.claim_status === 'BUSY') {
              return NextResponse.json({
                ok: false,
                error: '이 대화의 이전 요청을 아직 처리 중입니다. 완료 후 다시 시도해 주세요.',
                code: 'THREAD_BUSY',
                retryable: true,
                thread_id: thread.id,
              }, { status: 409 })
            }
            if (requestClaim.claim_status === 'DUPLICATE_FAILED') {
              return NextResponse.json({
                ok: false,
                error: '이미 실패 처리된 동일 요청입니다. 새 요청으로 다시 전송해 주세요.',
                code: 'REQUEST_ALREADY_FAILED',
                retryable: false,
                thread_id: thread.id,
              }, { status: 409 })
            }
            requestTracker = { supabase, requestId: requestClaim.request_id }

            const { data: userMessage, error: userMessageError } = await supabase"""
          if claim_marker not in route:
            raise SystemExit('request claim insertion marker not found')
          route = route.replace(claim_marker, claim_block, 1)

          success_marker = """    return NextResponse.json({
              ok: true,
              text: result.text,
              provider: 'openai',
              model,
              thread_id: thread.id,
              read_only: true,
              agent_runtime: 'MONI_AGENT_SDK_V2',
              agent_run_id: result.agentRunId,
              agent_steps: result.stepCount,
              tool_call_count: result.toolCallCount,
              tools_used: result.toolsUsed,
              usage: result.usage,
              memory_version: memoryRefresh.memoryVersion,
              pmo_handoff_status: isPmoRequest ? 'REQUESTED' : thread.pmo_handoff_status,
            })"""
          success_block = """    const responseBody = {
              ok: true,
              text: result.text,
              provider: 'openai',
              model,
              thread_id: thread.id,
              read_only: true,
              agent_runtime: 'MONI_AGENT_SDK_V2',
              agent_run_id: result.agentRunId,
              agent_steps: result.stepCount,
              tool_call_count: result.toolCallCount,
              tools_used: result.toolsUsed,
              usage: result.usage,
              memory_version: memoryRefresh.memoryVersion,
              pmo_handoff_status: isPmoRequest ? 'REQUESTED' : thread.pmo_handoff_status,
            }
            await finishAgentRequest({
              supabase,
              requestId: requestTracker!.requestId,
              status: 'COMPLETED',
              agentRunId: result.agentRunId,
              responseJson: responseBody,
            })
            requestTracker = null
            return NextResponse.json(responseBody)"""
          if success_marker not in route:
            raise SystemExit('success response marker not found')
          route = route.replace(success_marker, success_block, 1)

          catch_marker = """  } catch (error) {
            const message = error instanceof Error ? error.message : 'MONI Agent 응답 생성 중 오류가 발생했습니다.'
            console.error('[MONI_AGENT_SDK_ROUTE_ERROR]', { message, occurred_at: new Date().toISOString() })
            return NextResponse.json({ ok: false, error: message }, { status: 500 })
          }"""
          catch_block = """  } catch (error) {
            const message = error instanceof Error ? error.message : 'MONI Agent 응답 생성 중 오류가 발생했습니다.'
            if (requestTracker) {
              await finishAgentRequest({
                supabase: requestTracker.supabase,
                requestId: requestTracker.requestId,
                status: 'FAILED',
                errorMessage: message,
              }).catch((finishError) => console.error('[MONI_AGENT_REQUEST_FINISH_ERROR]', {
                message: finishError instanceof Error ? finishError.message : String(finishError),
                request_id: requestTracker?.requestId,
              }))
            }
            console.error('[MONI_AGENT_SDK_ROUTE_ERROR]', { message, occurred_at: new Date().toISOString() })
            return NextResponse.json({ ok: false, error: message }, { status: 500 })
          }"""
          if catch_marker not in route:
            raise SystemExit('route catch marker not found')
          route = route.replace(catch_marker, catch_block, 1)
          route_path.write_text(route)

          component_path = Path('src/components/GlobalMoniAgent.tsx')
          component = component_path.read_text()
          component = component.replace(
            "  pmo_handoff_status?: string\n}",
            "  pmo_handoff_status?: string\n  code?: string\n  retryable?: boolean\n}",
            1,
          )
          component = component.replace(
            "  const threadIdRef = useRef('')\n",
            "  const threadIdRef = useRef('')\n  const sendingRef = useRef(false)\n",
            1,
          )
          component = component.replace(
            "    if ((!question && !readyAttachments.length) || sending || uploading) return\n",
            "    if ((!question && !readyAttachments.length) || sendingRef.current || uploading) return\n",
            1,
          )
          component = component.replace(
            "    const visibleQuestion = question || '첨부한 자료를 분석해 주세요.'\n",
            "    const visibleQuestion = question || '첨부한 자료를 분석해 주세요.'\n    const clientRequestId = crypto.randomUUID()\n    sendingRef.current = true\n",
            1,
          )
          component = component.replace(
            "body: JSON.stringify({ message: question, messages: prior, page: pageContext(), thread_id: threadIdRef.current, attachment_ids: readyAttachments.map((item) => item.attachmentId) }),",
            "body: JSON.stringify({ message: question, messages: prior, page: pageContext(), thread_id: threadIdRef.current, attachment_ids: readyAttachments.map((item) => item.attachmentId), client_request_id: clientRequestId }),",
            1,
          )
          payload_marker = """      const payload = await response.json() as AgentResponse
            if (!response.ok || !payload.ok || !payload.text) throw new Error(payload.error || 'MONI 응답을 불러오지 못했습니다.')"""
          payload_block = """      const payload = await response.json() as AgentResponse
            if (response.status === 409 && (payload.code === 'THREAD_BUSY' || payload.code === 'REQUEST_ALREADY_FAILED')) {
              setMessages((current) => {
                const next = [...current]
                const last = next[next.length - 1]
                if (last?.role === 'user' && last.content === visibleQuestion) next.pop()
                return next
              })
              setError(payload.error || '이전 요청을 처리 중입니다.')
              return
            }
            if (!response.ok || !payload.ok || !payload.text) throw new Error(payload.error || 'MONI 응답을 불러오지 못했습니다.')"""
          if payload_marker not in component:
            raise SystemExit('frontend payload marker not found')
          component = component.replace(payload_marker, payload_block, 1)
          component = component.replace(
            "    } finally { setSending(false) }\n",
            "    } finally { sendingRef.current = false; setSending(false) }\n",
            1,
          )
          component_path.write_text(component)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/moni-agent-p0-session-stability.yml

      - name: Commit source wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/moni/agent-runtime/route.ts src/components/GlobalMoniAgent.tsx .github/workflows/moni-agent-p0-session-stability.yml
          git commit -m 'fix: enforce MONI agent request idempotency and thread lease'
          git push origin HEAD:fix/moni-session-toolchain-p0
