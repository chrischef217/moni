name: MONI Agent P0 Session Stability

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/moni-agent-p0-session-stability.yml'
      - 'scripts/apply-moni-agent-p0-session-stability.py'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/moni-session-toolchain-p0
          fetch-depth: 0

      - name: Apply source wiring
        run: python scripts/apply-moni-agent-p0-session-stability.py

      - name: Remove one-time files
        run: |
          rm .github/workflows/moni-agent-p0-session-stability.yml
          rm scripts/apply-moni-agent-p0-session-stability.py

      - name: Commit source wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/moni/agent-runtime/route.ts src/components/GlobalMoniAgent.tsx .github/workflows/moni-agent-p0-session-stability.yml scripts/apply-moni-agent-p0-session-stability.py
          git commit -m 'fix: enforce MONI agent request idempotency and thread lease'
          git push origin HEAD:fix/moni-session-toolchain-p0
