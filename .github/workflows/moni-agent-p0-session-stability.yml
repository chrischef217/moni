name: MONI Agent P0 Session Stability

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/moni-agent-p0-session-stability.yml'
      - 'scripts/apply-moni-agent-p0-session-stability.py'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/moni-session-toolchain-p0
          fetch-depth: 0

      - name: Correct chat-only insertion selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-moni-agent-p0-session-stability.py')
          source = path.read_text()
          old_payload = """if \"payload.code === 'THREAD_BUSY'\" not in component:
              if component.count(payload_anchor) != 1:
                  raise SystemExit(f'payload anchor count={component.count(payload_anchor)}')
              component = component.replace(payload_anchor, payload_anchor + payload_code, 1)
          """
          new_payload = """if \"payload.code === 'THREAD_BUSY'\" not in component:
              request_index = component.find('client_request_id: clientRequestId')
              if request_index < 0:
                  raise SystemExit('chat request id marker not found')
              payload_index = component.find(payload_anchor, request_index)
              if payload_index < 0:
                  raise SystemExit('chat payload anchor not found')
              insert_at = payload_index + len(payload_anchor)
              component = component[:insert_at] + payload_code + component[insert_at:]
          """
          if old_payload in source:
              source = source.replace(old_payload, new_payload, 1)
          elif new_payload not in source:
              raise SystemExit('payload selector source marker not found')

          old_final = "component = replace_once(component, \"    } finally { setSending(false) }\\n\", \"    } finally { sendingRef.current = false; setSending(false) }\\n\", 'sending ref release')"
          new_final = """if 'sendingRef.current = false; setSending(false)' not in component:
              send_start = component.find('  async function sendMessage')
              send_end = component.find('  async function handoffConversation', send_start)
              if send_start < 0 or send_end < 0:
                  raise SystemExit('sendMessage function boundary not found')
              send_block = component[send_start:send_end]
              final_marker = \"    } finally { setSending(false) }\\n\"
              if send_block.count(final_marker) != 1:
                  raise SystemExit(f'chat finally marker count={send_block.count(final_marker)}')
              send_block = send_block.replace(final_marker, \"    } finally { sendingRef.current = false; setSending(false) }\\n\", 1)
              component = component[:send_start] + send_block + component[send_end:]"""
          if old_final in source:
              source = source.replace(old_final, new_final, 1)
          elif new_final not in source:
              raise SystemExit('sending release source marker not found')
          path.write_text(source)
          PY

      - name: Apply source wiring
        run: python scripts/apply-moni-agent-p0-session-stability.py

      - name: Remove one-time files
        run: |
          rm .github/workflows/moni-agent-p0-session-stability.yml
          rm scripts/apply-moni-agent-p0-session-stability.py

      - name: Commit source wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/moni/agent-runtime/route.ts src/components/GlobalMoniAgent.tsx .github/workflows/moni-agent-p0-session-stability.yml scripts/apply-moni-agent-p0-session-stability.py
          git commit -m 'fix: enforce MONI agent request idempotency and thread lease'
          git push origin HEAD:fix/moni-session-toolchain-p0
