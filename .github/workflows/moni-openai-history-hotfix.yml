name: MONI OpenAI history hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/moni-openai-history-hotfix.yml'
      - '.github/moni-openai-history-hotfix.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch OpenAI Responses history content types
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/app/api/moni/agent-chat/route.ts')
          content = path.read_text(encoding='utf-8')
          old = """  const input: Json[] = history.map((item) => ({
            role: item.role,
            content: [{ type: 'input_text', text: item.content }],
          }))"""
          new = """  const input: Json[] = history.map((item) => ({
            role: item.role,
            content: [{
              type: item.role === 'assistant' ? 'output_text' : 'input_text',
              text: item.content,
            }],
          }))"""
          if old in content:
              path.write_text(content.replace(old, new, 1), encoding='utf-8')
          elif "item.role === 'assistant' ? 'output_text' : 'input_text'" not in content:
              raise SystemExit('OpenAI history mapping anchor not found')

      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          content = Path('src/app/api/moni/agent-chat/route.ts').read_text(encoding='utf-8')
          assert "item.role === 'assistant' ? 'output_text' : 'input_text'" in content
          assert "content: [{ type: 'input_text', text: item.content }]" not in content

      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "Hotfix already applied"
            exit 0
          fi
          git config user.name "MONI PMO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/moni/agent-chat/route.ts
          git commit -m "fix: encode OpenAI assistant history as output text"
          git push origin HEAD:main
