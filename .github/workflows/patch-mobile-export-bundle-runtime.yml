# trigger: 2026-08-22-runtime-fix
name: Patch mobile export bundle runtime

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-mobile-export-bundle-runtime.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-export-bundle-runtime
          fetch-depth: 0

      - name: Patch bundle runtime and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}\n---OLD---\n{old[:500]}')
              p.write_text(text.replace(old, new), encoding='utf-8')
              print('patched', path)

          extractor = 'src/lib/moni/mobile-sales-export-context.ts'
          replace_once(extractor,
          """  const rows = Array.isArray(raw.items) ? raw.items : []\n  const items = rows.map((row) => {\n    const item = (row && typeof row === 'object' ? row : {}) as Record<string, unknown>\n    return {\n      name: text(item.name, 240),\n      specification: text(item.specification, 240) || undefined,\n      quantity: numberOrNull(item.quantity),\n      unit: text(item.unit, 40).toUpperCase() || undefined,\n      cartons: numberOrNull(item.cartons),\n      unit_price: numberOrNull(item.unit_price),\n    }\n  }).filter((row) => row.name)\n""",
          """  const rows = Array.isArray(raw.items) ? raw.items : []\n  const normalizedItems = rows.map((row) => {\n    const item = (row && typeof row === 'object' ? row : {}) as Record<string, unknown>\n    return {\n      name: text(item.name, 240),\n      specification: text(item.specification, 240) || undefined,\n      quantity: numberOrNull(item.quantity),\n      unit: text(item.unit, 40).toUpperCase() || undefined,\n      cartons: numberOrNull(item.cartons),\n      unit_price: numberOrNull(item.unit_price),\n    }\n  }).filter((row) => row.name)\n  const seenItems = new Set<string>()\n  const items = normalizedItems.filter((row) => {\n    const key = [row.name, row.specification || '', row.quantity ?? '', row.unit || '', row.cartons ?? '', row.unit_price ?? '']\n      .map((value) => text(value, 300).normalize('NFKC').toLowerCase().replace(/\\s+/g, ''))\n      .join('|')\n    if (seenItems.has(key)) return false\n    seenItems.add(key)\n    return true\n  })\n""")
          replace_once(extractor,
          """  const history = input.history.slice(-12).map((row) => `${row.role === 'assistant' ? 'MONI' : '사용자'}: ${text(row.content, 2400)}`).join('\\n')\n""",
          """  const currentMessage = text(input.currentMessage, 4000)\n  const historyRows = input.history.slice(-12)\n  const priorHistory = [...historyRows]\n  for (let index = priorHistory.length - 1; index >= 0; index -= 1) {\n    if (priorHistory[index]?.role !== 'user') continue\n    if (text(priorHistory[index]?.content, 4000) === currentMessage) priorHistory.splice(index, 1)\n    break\n  }\n  const history = priorHistory.map((row) => `${row.role === 'assistant' ? 'MONI' : '사용자'}: ${text(row.content, 2400)}`).join('\\n')\n""")
          replace_once(extractor,
          """  const prompt = `[최근 대화]\\n${history}\\n\\n[현재 요청]\\n${text(input.currentMessage, 4000)}\\n\\n위 대화에서 이미 제공된 수출 거래 업무값만 추출하세요.`\n""",
          """  const prompt = `[최근 대화]\\n${history}\\n\\n[현재 요청]\\n${currentMessage}\\n\\n위 대화에서 이미 제공된 수출 거래 업무값만 추출하세요.`\n""")

          route = 'src/app/api/moni/mobile-sales-export-bundle/route.ts'
          replace_once(route,
          """function destinationMatch(query: string, destinations: any[]) {\n  const needle = normalize(query)\n  if (!needle) return null\n  const matches = destinations.filter((row: any) => {\n    const company = normalize(row.company_name)\n    const country = normalize(row.country)\n    const combined = `${company}${country}`\n    return needle === company || needle === combined || (company && needle.includes(company) && (!country || needle.includes(country)))\n  })\n  return matches.length === 1 ? matches[0] : null\n}\n\nfunction exactExportProduct(query: string, specification: string | undefined, settings: any[]) {\n  const needle = normalize(query)\n  const spec = normalize(specification)\n  if (!needle) return null\n  const matches = settings.filter((setting: any) => {\n    const product = productSnapshot(setting)\n    const names = [product?.product_name, product?.product_code, setting?.english_name].map(normalize).filter(Boolean)\n    if (!names.includes(needle)) return false\n    if (!spec) return true\n    const canonicalSpec = normalize(product?.product_spec)\n    return Boolean(canonicalSpec) && (canonicalSpec === spec || canonicalSpec.includes(spec) || spec.includes(canonicalSpec))\n  })\n  return matches.length === 1 ? matches[0] : null\n}\n""",
          """function destinationMatch(query: string, destinations: any[]) {\n  const needle = normalize(query)\n  if (!needle) return null\n\n  const directMatches = destinations.filter((row: any) => {\n    const company = normalize(row.company_name)\n    const country = normalize(row.country)\n    const combined = `${company}${country}`\n    return needle === company || needle === combined || (company.length >= 3 && needle.includes(company))\n  })\n  if (directMatches.length === 1) return directMatches[0]\n\n  const countryRules = [\n    { queries: ['라오스', 'laos', 'laopdr'], countries: ['lao', 'laopdr'] },\n    { queries: ['태국', 'thailand'], countries: ['thailand'] },\n    { queries: ['베트남', 'vietnam'], countries: ['vietnam'] },\n    { queries: ['캄보디아', 'cambodia'], countries: ['cambodia'] },\n    { queries: ['미얀마', 'myanmar'], countries: ['myanmar'] },\n    { queries: ['말레이시아', 'malaysia'], countries: ['malaysia'] },\n    { queries: ['싱가포르', 'singapore'], countries: ['singapore'] },\n    { queries: ['인도네시아', 'indonesia'], countries: ['indonesia'] },\n    { queries: ['필리핀', 'philippines'], countries: ['philippines'] },\n    { queries: ['일본', 'japan'], countries: ['japan'] },\n    { queries: ['중국', 'china'], countries: ['china'] },\n  ]\n  const countryNeedles = countryRules\n    .filter((rule) => rule.queries.some((alias) => needle.includes(normalize(alias))))\n    .flatMap((rule) => rule.countries.map(normalize))\n  if (!countryNeedles.length) return null\n  const countryMatches = destinations.filter((row: any) => {\n    const country = normalize(row.country)\n    return countryNeedles.some((alias) => country.includes(alias) || alias.includes(country))\n  })\n  return countryMatches.length === 1 ? countryMatches[0] : null\n}\n\nfunction productAliases(setting: any) {\n  const product = productSnapshot(setting)\n  const aliases = new Set<string>()\n  for (const raw of [product?.product_name, product?.product_code, setting?.english_name]) {\n    const value = normalize(raw)\n    if (!value) continue\n    aliases.add(value)\n    if (value.startsWith('두배') && value.length > 2) aliases.add(value.slice(2))\n  }\n  return [...aliases]\n}\n\nfunction uniqueExportProduct(query: string, specification: string | undefined, settings: any[]) {\n  const needle = normalize(query)\n  const spec = normalize(specification)\n  if (!needle) return null\n  const ranked = settings.map((setting: any) => {\n    const aliases = productAliases(setting)\n    const exact = aliases.some((alias) => alias === needle)\n    const contained = !exact && needle.length >= 3 && aliases.some((alias) => alias.includes(needle) || needle.includes(alias))\n    if (!exact && !contained) return null\n    const product = productSnapshot(setting)\n    const detail = normalize(`${product?.product_name || ''}${product?.product_spec || ''}${setting?.english_name || ''}`)\n    return { setting, score: (exact ? 100 : 60) + (spec && detail.includes(spec) ? 20 : 0) }\n  }).filter(Boolean) as Array<{ setting: any; score: number }>\n  if (!ranked.length) return null\n  const bestScore = Math.max(...ranked.map((row) => row.score))\n  const best = ranked.filter((row) => row.score === bestScore)\n  return best.length === 1 ? best[0].setting : null\n}\n""")
          replace_once(route, "    const setting = exactExportProduct(row.name, row.specification, meta.export_products)\n", "    const setting = uniqueExportProduct(row.name, row.specification, meta.export_products)\n")
          replace_once(route,
          """  const extracted = await extractMobileSalesExportContext({ currentMessage, history: history.map((row: any) => ({ role: row.role, content: row.content })) })\n""",
          """  const priorHistory = history.filter((row: any) => text(row.id, 100) !== sourceUserId)\n  const extracted = await extractMobileSalesExportContext({ currentMessage, history: priorHistory.map((row: any) => ({ role: row.role, content: row.content })) })\n""")
          replace_once(route,
          """    const orderId = text(sync.sales_order_id, 120)\n    const snapshot = {\n""",
          """    const orderId = text(sync.sales_order_id, 120)\n    if (!uuidLike(orderId)) throw new Error('판매관리 동기화 결과의 sales_order_id가 올바르지 않습니다.')\n    const snapshot = {\n""")
          replace_once(route,
          """    const complete = await db.from('moni_action_confirmations').update({ status: 'EXECUTED', target_id: documentId, result_snapshot: snapshot, executed_at: new Date().toISOString(), error_message: null }).eq('id', confirmation.id).eq('status', 'EXECUTING')\n    if (complete.error) throw new Error(complete.error.message)\n    await db.from('moni_action_audit_log').insert({ confirmation_id: confirmation.id, business_id: BUSINESS_ID, action_domain: ACTION_DOMAIN, action_type: 'CREATE', target_table: 'export_documents', target_id: documentId, before_snapshot: null, after_snapshot: snapshot, actor_login_id: session.loginId, actor_role: session.role, source_client_id: `moni-mobile:${threadId}`, user_confirmation_text: '모바일 수출 문서 번들 최종 확정' })\n""",
          """    const complete = await db.from('moni_action_confirmations').update({ status: 'EXECUTED', target_id: orderId, result_snapshot: snapshot, executed_at: new Date().toISOString(), error_message: null }).eq('id', confirmation.id).eq('status', 'EXECUTING')\n    if (complete.error) throw new Error(complete.error.message)\n    await db.from('moni_action_audit_log').insert({ confirmation_id: confirmation.id, business_id: BUSINESS_ID, action_domain: ACTION_DOMAIN, action_type: 'CREATE', target_table: 'sales_orders', target_id: orderId, before_snapshot: null, after_snapshot: snapshot, actor_login_id: session.loginId, actor_role: session.role, source_client_id: `moni-mobile:${threadId}`, user_confirmation_text: '모바일 수출 문서 번들 최종 확정' })\n""")

          cards = 'src/components/MoniMobileBusinessCards.tsx'
          replace_once(cards, "type Domain = 'packaging_inbound' | 'production_plan' | 'production_work' | 'sales_order' | 'sales_statement' | 'purchase' | 'payment'\n", "type Domain = 'packaging_inbound' | 'production_plan' | 'production_work' | 'sales_order' | 'sales_statement' | 'sales_export_bundle' | 'purchase' | 'payment'\n")
          replace_once(cards,
          """  if (domain === 'sales_order') return operation === 'CREATE' ? '제품 판매등록' : operation === 'UPDATE' ? '제품 판매 수정' : '제품 판매 취소'\n  if (domain === 'purchase') return operation === 'CREATE' ? '매입 등록' : '매입 취소'\n""",
          """  if (domain === 'sales_order') return operation === 'CREATE' ? '제품 판매등록' : operation === 'UPDATE' ? '제품 판매 수정' : '제품 판매 취소'\n  if (domain === 'sales_export_bundle') return '수출 문서 번들'\n  if (domain === 'purchase') return operation === 'CREATE' ? '매입 등록' : '매입 취소'\n""")
          replace_once(cards,
          """      if (next && (next.domain === 'sales_statement' || (next.domain === 'sales_order' && next.operation === 'CREATE'))) { setCard(null); activeCardSourceRef.current = ''; return }\n""",
          """      if (next && (next.domain === 'sales_statement' || next.domain === 'sales_export_bundle' || (next.domain === 'sales_order' && next.operation === 'CREATE'))) { setCard(null); activeCardSourceRef.current = ''; return }\n""")

          Path('tests/moni-agent-mobile-context-export-bundle.test.mjs').write_text(r'''import test from 'node:test'
import assert from 'node:assert/strict'
import { readFileSync } from 'node:fs'

const intents = readFileSync('src/lib/moni/mobile-business-intents.ts', 'utf8')
const start = readFileSync('src/app/api/moni/mobile-action-start/route.ts', 'utf8')
const route = readFileSync('src/app/api/moni/mobile-sales-export-bundle/route.ts', 'utf8')
const extractor = readFileSync('src/lib/moni/mobile-sales-export-context.ts', 'utf8')
const card = readFileSync('src/components/MoniMobileSalesExportBundleCard.tsx', 'utf8')
const legacyCards = readFileSync('src/components/MoniMobileBusinessCards.tsx', 'utf8')
const mobilePage = readFileSync('src/app/mobile/page.tsx', 'utf8')

function at(source, token) { const index = source.indexOf(token); assert.notEqual(index, -1, `missing token: ${token}`); return index }

test('combined statement and export docs route to bundle first', () => {
  const bundle = at(intents, "return { domain: 'sales_export_bundle', operation: 'CREATE' }")
  const statement = at(intents, "return { domain: 'sales_statement', operation: 'CREATE' }")
  assert.ok(bundle < statement)
})

test('structured bundle bypasses long agent runtime', () => {
  assert.match(start, /classifyMobileBusinessIntent\(rawMessage\)/)
  assert.match(start, /structured_action_card: true/)
})

test('bundle extraction reads prior conversation once and deduplicates exact rows', () => {
  assert.match(route, /priorHistory = history\.filter/)
  assert.match(route, /history: priorHistory\.map/)
  assert.match(extractor, /const priorHistory = \[\.\.\.historyRows\]/)
  assert.match(extractor, /priorHistory\.splice\(index, 1\)/)
  assert.match(extractor, /const seenItems = new Set<string>\(\)/)
  assert.match(extractor, /if \(seenItems\.has\(key\)\) return false/)
})

test('canonical product auto-match only accepts a unique highest scoring alias candidate', () => {
  assert.match(route, /function productAliases/)
  assert.match(route, /value\.startsWith\('두배'\)/)
  assert.match(route, /function uniqueExportProduct/)
  assert.match(route, /alias\.includes\(needle\) \|\| needle\.includes\(alias\)/)
  assert.match(route, /return best\.length === 1 \? best\[0\]\.setting : null/)
})

test('country hint only auto-selects one unique registered destination', () => {
  assert.match(route, /queries: \['라오스', 'laos', 'laopdr'\]/)
  assert.match(route, /countryMatches\.length === 1 \? countryMatches\[0\] : null/)
})

test('kg and ea quantities convert to cartons only on exact integer packing ratios', () => {
  assert.match(route, /if \(unit === 'EA'\)/)
  assert.match(route, /if \(unit === 'KG'\)/)
  assert.match(route, /Math\.abs\(ratio - Math\.round\(ratio\)\) < 0\.000001/)
})

test('execute records UUID sales order target rather than text export document id', () => {
  assert.match(route, /if \(!uuidLike\(orderId\)\)/)
  assert.match(route, /target_id: orderId/)
  assert.match(route, /target_table: 'sales_orders'/)
  assert.doesNotMatch(route, /target_id: documentId/)
})

test('legacy generic business card is suppressed for export bundles', () => {
  assert.match(legacyCards, /\| 'sales_export_bundle'/)
  assert.match(legacyCards, /next\.domain === 'sales_export_bundle'/)
})

test('bundle keeps approval safety, rollback, and final document links', () => {
  const create = at(route, "internalJson(request, '/api/moni/export-documents'")
  const sync = at(route, "internalJson(request, '/api/moni/export-sales-sync', { method: 'POST', body: JSON.stringify({ id: documentId, action: 'SYNC' }) })")
  assert.ok(create < sync)
  assert.match(route, /rollbackBundle\(request, documentId\)/)
  assert.match(route, /statement_url:/)
  assert.match(route, /invoice_url:/)
  assert.match(route, /packing_list_url:/)
  assert.match(route, /export_bundle_url:/)
  assert.match(card, /거래명세표 보기/)
  assert.match(card, /Commercial Invoice 보기/)
  assert.match(card, /Packing List 보기/)
  assert.match(mobilePage, /MoniMobileSalesExportBundleCard/)
})
''', encoding='utf-8')
          PY

      - name: Install and run focused tests
        run: |
          npm ci --no-audit --no-fund
          node --test tests/moni-agent-mobile-context-export-bundle.test.mjs

      - name: Commit patch to target branch
        shell: bash
        run: |
          git config user.name "MONI PMO Hotfix"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/moni/mobile-sales-export-context.ts src/app/api/moni/mobile-sales-export-bundle/route.ts src/components/MoniMobileBusinessCards.tsx tests/moni-agent-mobile-context-export-bundle.test.mjs
          git commit -m "Fix mobile export bundle runtime and auto matching"
          git push origin HEAD:fix/mobile-export-bundle-runtime
