name: Patch Mobile First Structured Turn

on:
  push:
    branches: ["fix/mobile-first-structured-turn"]
    paths:
      - ".github/workflows/patch-mobile-first-structured-turn.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-first-structured-turn
          fetch-depth: 0

      - name: Patch first structured turn routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('src/components/MoniMobileChat.tsx')
          text = chat.read_text(encoding='utf-8')
          old = "structuredRequest && threadId ? '/api/moni/mobile-action-start' : '/api/moni/agent-runtime'"
          new = "structuredRequest ? '/api/moni/mobile-action-start' : '/api/moni/agent-runtime'"
          if text.count(old) != 1:
              raise SystemExit(f'chat routing pattern count={text.count(old)}')
          chat.write_text(text.replace(old, new), encoding='utf-8')

          route = Path('src/app/api/moni/mobile-action-start/route.ts')
          text = route.read_text(encoding='utf-8')
          old = """    const threadId = text(body.thread_id, 80)\n    if (!threadId) return NextResponse.json({ ok: false, error: 'MONI 대화방이 준비되지 않았습니다.' }, { status: 400 })\n    const page = cleanPage(body.page)\n    const db = createMoniServiceRoleClient()\n    const threadResult = await db.from('moni_ai_threads').select('id,title,status').eq('id', threadId).eq('business_id', BUSINESS_ID).eq('user_login_id', session.loginId).eq('status', 'ACTIVE').maybeSingle()\n    if (threadResult.error) throw new Error(threadResult.error.message)\n    if (!threadResult.data) return NextResponse.json({ ok: false, error: 'MONI 대화방을 확인할 수 없습니다.' }, { status: 404 })\n"""
          new = """    let threadId = text(body.thread_id, 80)\n    const page = cleanPage(body.page)\n    const db = createMoniServiceRoleClient()\n    let threadResult: any\n    if (threadId) {\n      threadResult = await db.from('moni_ai_threads').select('id,title,status').eq('id', threadId).eq('business_id', BUSINESS_ID).eq('user_login_id', session.loginId).eq('status', 'ACTIVE').maybeSingle()\n      if (threadResult.error) throw new Error(threadResult.error.message)\n      if (!threadResult.data) return NextResponse.json({ ok: false, error: 'MONI 대화방을 확인할 수 없습니다.' }, { status: 404 })\n    } else {\n      const createdThread = await db.from('moni_ai_threads').insert({\n        business_id: BUSINESS_ID,\n        user_login_id: session.loginId,\n        user_display_name: session.displayName,\n        user_role: session.role,\n        current_page: page,\n      }).select('id,title,status').single()\n      if (createdThread.error) throw new Error(createdThread.error.message)\n      threadId = createdThread.data.id\n      threadResult = { data: createdThread.data, error: null }\n    }\n"""
          if text.count(old) != 1:
              raise SystemExit(f'route bootstrap pattern count={text.count(old)}')
          route.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run focused regression
        run: node --test tests/moni-agent-mobile-first-structured-turn.test.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "MONI PMO Patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/MoniMobileChat.tsx src/app/api/moni/mobile-action-start/route.ts
          git commit -m "Fix first structured mobile turn routing"
          git push origin HEAD:fix/mobile-first-structured-turn
