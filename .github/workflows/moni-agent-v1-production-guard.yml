name: MONI Agent V1 production guard

on:
  push:
    branches:
      - agent/moni-agent-runtime-v1
    paths:
      - '.github/workflows/moni-agent-v1-production-guard.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/moni-agent-runtime-v1
          fetch-depth: 0
      - name: Add production truncation and unit mismatch guards
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/moni/agent-v2.ts')
          s = path.read_text(encoding='utf-8')
          start = s.index('async function toolSearchProduction(')
          end = s.index('async function toolSearchProductionPlans(', start)
          segment = s[start:end]

          old = """  const status = text(args.status, 80)
          let query = context.supabase
"""
          new = """  const status = text(args.status, 80)
          const rowLimit = limit(args.limit, 100)
          let query = context.supabase
"""
          if old not in segment:
              raise SystemExit('production rowLimit anchor not found')
          segment = segment.replace(old, new, 1)
          segment = segment.replace('.limit(limit(args.limit, 100))', '.limit(rowLimit)', 1)

          old = """  const rows = data ?? []
          const byProduct = new Map<string, Json>()
"""
          new = """  const rows = data ?? []
          const dataQualityFlags = rows
            .filter((row: any) => {
              const plannedQuantity = num(row.planned_quantity_g)
              const actualQuantity = num(row.actual_quantity_g)
              return plannedQuantity >= 10_000_000 && (actualQuantity <= 0 || plannedQuantity / Math.max(actualQuantity, 1) >= 100)
            })
            .map((row: any) => ({
              type: 'SUSPECTED_WEIGHT_UNIT_MISMATCH',
              record_id: row.id,
              lot_number: row.lot_number,
              work_date: row.work_date,
              product_name: row.product_name,
              status: row.status,
              planned_quantity_g: num(row.planned_quantity_g),
              actual_quantity_g: num(row.actual_quantity_g),
              note: row.note,
              warning: '계획중량이 10,000,000g 이상이고 완료량이 없거나 계획/완료 비율이 100배 이상입니다. 단위 입력을 확인해야 합니다.',
            }))
          const byProduct = new Map<string, Json>()
"""
          if old not in segment:
              raise SystemExit('production quality anchor not found')
          segment = segment.replace(old, new, 1)

          old = """    filters: { product_query: product || null, status: status || null },
            summary: {
"""
          new = """    filters: { product_query: product || null, status: status || null },
            result_scope: {
              row_limit: rowLimit,
              returned_record_count: rows.length,
              may_be_truncated: rows.length >= rowLimit,
              warning: rows.length >= rowLimit ? '조회 상한에 도달했습니다. 전체 집계로 단정하지 말고 조건을 좁혀 추가 조회해야 합니다.' : null,
            },
            summary: {
"""
          if old not in segment:
              raise SystemExit('production scope anchor not found')
          segment = segment.replace(old, new, 1)

          old = """    by_product: [...byProduct.values()].sort((a: any, b: any) => b.actual_quantity_g - a.actual_quantity_g),
            records: rows,
"""
          new = """    by_product: [...byProduct.values()].sort((a: any, b: any) => b.actual_quantity_g - a.actual_quantity_g),
            data_quality_flags: dataQualityFlags,
            records: rows,
"""
          if old not in segment:
              raise SystemExit('production flags return anchor not found')
          segment = segment.replace(old, new, 1)
          s = s[:start] + segment + s[end:]

          old = """    case 'search_production_records': return toolSearchProduction(args, context)
"""
          new = """    case 'search_production_records': {
              const result = await toolSearchProduction(args, context)
              if (result.data_quality_flags.length) {
                await reportMoniPmoEvent(context, {
                  event_type: 'DATA_QUALITY',
                  severity: 'HIGH',
                  title: '생산계획 중량 단위 불일치 의심',
                  summary: `${result.range.start_date}~${result.range.end_date} 생산조회에서 계획중량 단위 불일치 의심 행 ${result.data_quality_flags.length}건을 발견했습니다.`,
                  evidence: {
                    tool_name: 'search_production_records',
                    range: result.range,
                    filters: result.filters,
                    flags: result.data_quality_flags,
                  },
                })
              }
              return result
            }
"""
          if old not in s:
              raise SystemExit('production switch anchor not found')
          s = s.replace(old, new, 1)
          path.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "MONI PMO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/moni/agent-v2.ts
          git commit -m "feat: guard MONI production summaries against suspect units"
          git push origin HEAD:agent/moni-agent-runtime-v1
