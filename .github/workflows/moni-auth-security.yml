name: MONI Auth Security Gate

on:
  pull_request:
    paths:
      - 'src/lib/allowance/secure-auth.ts'
      - 'src/lib/allowance/session.ts'
      - 'src/lib/moni/db.ts'
      - 'src/lib/moni/mcp/session.ts'
      - 'src/lib/supabase.ts'
      - 'src/lib/migrate_doobae.ts'
      - 'src/app/api/chat/**'
      - 'src/app/api/migrate/**'
      - 'src/app/api/migrate-bom/**'
      - 'src/app/api/allowance/auth/**'
      - 'supabase/migrations/*allowance_session*'
      - 'tests/allowance-auth-security.test.mjs'
      - '.github/workflows/moni-auth-security.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moni-auth-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  auth-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-service-role-key
      ALLOWANCE_ENCRYPTION_KEY: build-only-allowance-encryption-key-32
      OPENAI_API_KEY: sk-build-only-not-a-real-secret
      OPENAI_MONI_MODEL: gpt-5
      MONI_BUSINESS_ID: '20220523011'
      MONI_MCP_ENABLED: 'false'
      MONI_PUBLIC_BASE_URL: https://moni-sigma.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify immutable source
        run: npm run prebuild

      - name: Auth security contract tests
        run: node --test tests/allowance-auth-security.test.mjs

      - name: Production build
        run: npm run build
