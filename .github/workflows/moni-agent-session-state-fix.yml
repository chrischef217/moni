name: MONI Agent Session State Fix

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/moni-agent-session-state-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/moni-agent-session-state-machine
          fetch-depth: 0
      - name: Apply state-machine stabilization
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/lib/moni/agent/supabase-session.ts')
          s = p.read_text()
          marker = 'export class SupabaseMoniSession implements Session {'
          helper = '''function coherentSessionSuffix(items: AgentInputItem[], limit: number) {
            const suffix = items.slice(-limit)
            const presentCalls = new Set(suffix.filter((item) => (item as any)?.type === 'function_call').map((item) => String((item as any).callId || '')).filter(Boolean))
            const missingCallIds = new Set(suffix.filter((item) => (item as any)?.type === 'function_call_result').map((item) => String((item as any).callId || '')).filter((callId) => callId && !presentCalls.has(callId)))
            if (!missingCallIds.size) return suffix
            const requiredCalls = items.filter((item) => (item as any)?.type === 'function_call' && missingCallIds.has(String((item as any).callId || '')))
            return [...requiredCalls, ...suffix]
          }

          '''
          if 'function coherentSessionSuffix' not in s:
            if marker not in s: raise SystemExit('session class marker missing')
            s = s.replace(marker, helper + marker, 1)
          s = s.replace("    const rowLimit = Math.max(1, Math.min(100, limit || 40))", "    const rowLimit = Math.max(1, Math.min(100, limit || 40))\n    const fetchLimit = Math.min(200, Math.max(rowLimit * 4, rowLimit))", 1)
          s = s.replace('.limit(rowLimit)', '.limit(fetchLimit)', 2)
          old = "    return (data ?? []).reverse().map((row) => row.item as AgentInputItem)"
          new = "    const items = (data ?? []).reverse().map((row) => row.item as AgentInputItem)\n    return coherentSessionSuffix(items, rowLimit)"
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit('session return marker missing')
          p.write_text(s)

          p = Path('src/lib/moni/agent/sdk-runtime.ts')
          s = p.read_text()
          block = """      sessionInputCallback: (history: any[], newItems: any[]) => [
        ...history.slice(-SESSION_HISTORY_LIMIT),
        ...newItems,
      ],
"""
          if block in s: s = s.replace(block, '', 1)
          elif 'sessionInputCallback:' in s: raise SystemExit('unexpected callback shape')
          p.write_text(s)

          p = Path('src/components/GlobalMoniAgent.tsx')
          s = p.read_text()
          marker = "  const threadIdRef = useRef('')"
          if 'const sendingRef = useRef(false)' not in s: s = s.replace(marker, marker + "\n  const sendingRef = useRef(false)", 1)
          old = "    if ((!question && !readyAttachments.length) || sending || uploading) return"
          new = "    if ((!question && !readyAttachments.length) || sendingRef.current || uploading) return\n    sendingRef.current = true\n    const clientRequestId = crypto.randomUUID()"
          if old in s: s = s.replace(old, new, 1)
          elif new not in s: raise SystemExit('send guard marker missing')
          old_body = "body: JSON.stringify({ message: question, messages: prior, page: pageContext(), thread_id: threadIdRef.current, attachment_ids: readyAttachments.map((item) => item.attachmentId) }),"
          new_body = "body: JSON.stringify({ message: question, messages: prior, page: pageContext(), thread_id: threadIdRef.current, attachment_ids: readyAttachments.map((item) => item.attachmentId), client_request_id: clientRequestId }),"
          if old_body in s: s = s.replace(old_body, new_body, 1)
          elif new_body not in s: raise SystemExit('request body marker missing')
          s = s.replace("    } finally { setSending(false) }", "    } finally { sendingRef.current = false; setSending(false) }", 1)
          p.write_text(s)

          p = Path('src/app/api/moni/agent-runtime/route.ts')
          s = p.read_text()
          s = s.replace("  attachment_ids?: string[]\n}", "  attachment_ids?: string[]\n  client_request_id?: string\n}", 1)
          post = "export async function POST(request: NextRequest) {\n  const legacyRequest = new NextRequest(request.clone())\n  try {"
          repl = "export async function POST(request: NextRequest) {\n  const legacyRequest = new NextRequest(request.clone())\n  let requestClaim: { supabase: SupabaseClient; id: string } | null = null\n  try {"
          if post in s: s = s.replace(post, repl, 1)
          elif repl not in s: raise SystemExit('POST marker missing')
          marker = "    const thread = await ensureThread(supabase, session, text(body.thread_id, 80), page)\n    const attachments = await loadAttachments"
          code = """    const thread = await ensureThread(supabase, session, text(body.thread_id, 80), page)
    const clientRequestId = text(body.client_request_id, 120)
    if (!clientRequestId) return NextResponse.json({ ok: false, error: '요청 식별자가 필요합니다.' }, { status: 400 })
    const staleBefore = new Date(Date.now() - 2 * 60 * 1000).toISOString()
    await supabase.from('moni_ai_agent_request_claims').update({ status: 'ABORTED', finished_at: new Date().toISOString(), error_message: 'stale in-flight request recovered', updated_at: new Date().toISOString() }).eq('business_id', BUSINESS_ID).eq('thread_id', thread.id).eq('status', 'RUNNING').lt('started_at', staleBefore)
    const { data: claim, error: claimError } = await supabase.from('moni_ai_agent_request_claims').insert({ business_id: BUSINESS_ID, thread_id: thread.id, client_request_id: clientRequestId, status: 'RUNNING' }).select('id').single()
    if (claimError) {
      if (claimError.code === '23505') return NextResponse.json({ ok: false, error: '이 대화의 이전 요청이 아직 처리 중이거나 이미 처리됐습니다.' }, { status: 409 })
      throw new Error(claimError.message)
    }
    requestClaim = { supabase, id: claim.id }
    const attachments = await loadAttachments"""
          if marker in s: s = s.replace(marker, code, 1)
          elif 'moni_ai_agent_request_claims' not in s: raise SystemExit('claim marker missing')
          marker = "    return NextResponse.json({\n      ok: true,\n      text: result.text,"
          repl = "    await requestClaim.supabase.from('moni_ai_agent_request_claims').update({ status: 'COMPLETED', finished_at: new Date().toISOString(), updated_at: new Date().toISOString() }).eq('id', requestClaim.id)\n    return NextResponse.json({\n      ok: true,\n      text: result.text,"
          if marker in s: s = s.replace(marker, repl, 1)
          elif repl not in s: raise SystemExit('success marker missing')
          marker = "  } catch (error) {\n    const message = error instanceof Error ? error.message : 'MONI Agent 응답 생성 중 오류가 발생했습니다.'"
          repl = "  } catch (error) {\n    const message = error instanceof Error ? error.message : 'MONI Agent 응답 생성 중 오류가 발생했습니다.'\n    if (requestClaim) await requestClaim.supabase.from('moni_ai_agent_request_claims').update({ status: 'FAILED', finished_at: new Date().toISOString(), error_message: message.slice(0, 1000), updated_at: new Date().toISOString() }).eq('id', requestClaim.id).catch(() => undefined)"
          if marker in s: s = s.replace(marker, repl, 1)
          elif repl not in s: raise SystemExit('catch marker missing')
          p.write_text(s)
          PY
      - name: Remove workflow
        run: rm .github/workflows/moni-agent-session-state-fix.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/moni/agent/supabase-session.ts src/lib/moni/agent/sdk-runtime.ts src/components/GlobalMoniAgent.tsx src/app/api/moni/agent-runtime/route.ts .github/workflows/moni-agent-session-state-fix.yml
          git commit -m 'fix: stabilize MONI agent session state machine'
          git push origin HEAD:fix/moni-agent-session-state-machine
