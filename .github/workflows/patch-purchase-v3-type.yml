# trigger: purchase v3 union narrowing
name: Patch Purchase V3 Type

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-purchase-v3-type.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-purchase-authoritative-preview
          fetch-depth: 0
      - name: Narrow raw vs packaging material union
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/app/api/moni/mobile-purchase-actions-v3/route.ts')
          s=p.read_text(encoding='utf-8')
          old="material_name: text(material.item_name || material.material_name)"
          new="material_name: text('item_name' in material ? material.item_name : material.material_name)"
          if s.count(old) != 1:
              raise SystemExit(f'expected one material label expression, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build exact patched branch
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
          SUPABASE_SERVICE_ROLE_KEY: build-only-service-role-key
          ALLOWANCE_ENCRYPTION_KEY: build-only-allowance-encryption-key-32
          MONI_BUSINESS_ID: "20220523011"
          MONI_MCP_ENABLED: "false"
          MONI_PUBLIC_BASE_URL: https://moni-sigma.vercel.app
        run: npm run build
      - name: Commit patched branch
        run: |
          git config user.name "MONI PMO Patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/moni/mobile-purchase-actions-v3/route.ts
          git commit -m "Fix purchase V3 material type narrowing"
          git push origin HEAD:fix/mobile-purchase-authoritative-preview
