name: MONI Agent Lockfile Sync

on:
  push:
    branches:
      - agent/moni-production-agent-v2-foundation
    paths:
      - 'package.json'
      - '.github/workflows/moni-agent-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile sync]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/moni-production-agent-v2-foundation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync MONI agent dependency lockfile [lockfile sync]"
          git push origin HEAD:agent/moni-production-agent-v2-foundation
