name: One-time fix purchase conversion

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-purchase-conversion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch purchase receipt conversion
        run: |
          python - <<'PY'
          from pathlib import Path

          types = Path('src/components/purchase-receipts/types.ts')
          s = types.read_text(encoding='utf-8')
          old = """  tax_invoice_required: boolean
}"""
          new = """  tax_invoice_required: boolean
  tax_type?: 'TAXABLE' | 'EXEMPT' | 'ZERO_RATE' | string
}"""
          if old not in s:
              raise SystemExit('Supplier type block not found')
          types.write_text(s.replace(old, new, 1), encoding='utf-8')

          path = Path('src/components/purchase-receipts/ReceiptEditorModal.tsx')
          s = path.read_text(encoding='utf-8')

          old = """  const priceFor = (category: PurchaseCategory, materialId: string, unit: PurchaseUnit) => {
    if (category === 'PACKAGING') return Number(packagingMaterials.find((row) => row.id === materialId || row.material_code === materialId)?.unit_price ?? 0)
    const raw = rawMaterials.find((row) => row.id === materialId || row.item_code === materialId)
    const perKg = Number(raw?.unit_price_per_kg ?? 0)
    if (unit === 'G') return perKg / 1000
    if (unit === 'EA') return perKg * Number(raw?.packing_weight_g ?? 0) / 1000
    return perKg
  }
"""
          new = """  const priceFor = (category: PurchaseCategory, materialId: string, unit: PurchaseUnit) => {
    if (category === 'PACKAGING') {
      return Number(packagingMaterials.find((row) => row.id === materialId || row.material_code === materialId)?.unit_price ?? 0)
    }
    const raw = rawMaterials.find((row) => row.id === materialId || row.item_code === materialId)
    const purchasePackPrice = Number(raw?.unit_price_per_kg ?? 0)
    const packWeightG = Number(raw?.packing_weight_g ?? 0)
    if (purchasePackPrice <= 0 || packWeightG <= 0) return 0
    if (unit === 'EA') return purchasePackPrice
    if (unit === 'G') return purchasePackPrice / packWeightG
    return purchasePackPrice / (packWeightG / 1000)
  }

  const calculatedAmounts = (
    category: PurchaseCategory,
    materialId: string,
    unit: PurchaseUnit,
    quantity: number,
    supplierId: string,
  ) => {
    const unitPrice = priceFor(category, materialId, unit)
    const supplyAmount = Math.round(Math.max(0, Number(quantity || 0)) * unitPrice)
    const supplier = suppliers.find((row) => row.id === supplierId)
    const vatAmount = supplier && (supplier.tax_type || 'TAXABLE') === 'TAXABLE' ? Math.round(supplyAmount * 0.1) : 0
    return { unitPrice, supplyAmount, vatAmount, totalAmount: supplyAmount + vatAmount }
  }
"""
          if old not in s:
              raise SystemExit('priceFor block not found')
          s = s.replace(old, new, 1)

          old = """  const selectSupplier = (supplierId: string) => {
    const supplier = suppliers.find((row) => row.id === supplierId)
    setDraft((current) => ({
      ...current,
      supplier_id: supplierId,
      supplier_name_snapshot: supplier?.company_name || '',
      planned_payment_method: supplier?.default_payment_method || 'BANK_TRANSFER',
      planned_payment_account: supplier?.default_payment_account || '',
      planned_card_name: supplier?.default_card_name || '',
      planned_installment_months: supplier?.default_installment_months || 1,
      tax_invoice_status: supplier?.tax_invoice_required === false ? 'NOT_REQUIRED' : 'NOT_RECEIVED',
    }))
  }
"""
          new = """  const selectSupplier = (supplierId: string) => {
    const supplier = suppliers.find((row) => row.id === supplierId)
    setDraft((current) => {
      const amounts = calculatedAmounts(current.purchase_category, current.material_id, current.unit, current.quantity, supplierId)
      return {
        ...current,
        supplier_id: supplierId,
        supplier_name_snapshot: supplier?.company_name || '',
        planned_payment_method: supplier?.default_payment_method || 'BANK_TRANSFER',
        planned_payment_account: supplier?.default_payment_account || '',
        planned_card_name: supplier?.default_card_name || '',
        planned_installment_months: supplier?.default_installment_months || 1,
        tax_invoice_status: supplier?.tax_invoice_required === false ? 'NOT_REQUIRED' : 'NOT_RECEIVED',
        unit_price: amounts.unitPrice,
        supply_amount: amounts.supplyAmount,
        vat_amount: amounts.vatAmount,
        total_amount: amounts.totalAmount,
      }
    })
  }
"""
          if old not in s:
              raise SystemExit('selectSupplier block not found')
          s = s.replace(old, new, 1)

          old = """  const changeUnit = (unit: PurchaseUnit) => {
    setDraft((current) => {
      const unitPrice = priceFor(current.purchase_category, current.material_id, unit)
      const supplyAmount = Number(current.quantity || 0) * unitPrice
      return { ...current, unit, unit_price: unitPrice, supply_amount: supplyAmount, total_amount: supplyAmount + Number(current.vat_amount || 0) }
    })
  }

  const selectMaterial = (materialId: string) => {
    setDraft((current) => {
      const unitPrice = priceFor(current.purchase_category, materialId, current.unit)
      const supplyAmount = Number(current.quantity || 0) * unitPrice
      return { ...current, material_id: materialId, unit_price: unitPrice, supply_amount: supplyAmount, total_amount: supplyAmount + Number(current.vat_amount || 0) }
    })
  }
"""
          new = """  const changeUnit = (unit: PurchaseUnit) => {
    setDraft((current) => {
      const amounts = calculatedAmounts(current.purchase_category, current.material_id, unit, current.quantity, current.supplier_id)
      return { ...current, unit, unit_price: amounts.unitPrice, supply_amount: amounts.supplyAmount, vat_amount: amounts.vatAmount, total_amount: amounts.totalAmount }
    })
  }

  const selectMaterial = (materialId: string) => {
    setDraft((current) => {
      const amounts = calculatedAmounts(current.purchase_category, materialId, current.unit, current.quantity, current.supplier_id)
      return { ...current, material_id: materialId, unit_price: amounts.unitPrice, supply_amount: amounts.supplyAmount, vat_amount: amounts.vatAmount, total_amount: amounts.totalAmount }
    })
  }
"""
          if old not in s:
              raise SystemExit('unit/material blocks not found')
          s = s.replace(old, new, 1)

          old = """  const changeAmount = (field: 'quantity' | 'unit_price' | 'supply_amount' | 'vat_amount', value: number) => {
    setDraft((current) => {
      const next = { ...current, [field]: value }
      if (field === 'quantity' || field === 'unit_price') next.supply_amount = Number(next.quantity || 0) * Number(next.unit_price || 0)
      next.total_amount = Number(next.supply_amount || 0) + Number(next.vat_amount || 0)
      return next
    })
  }
"""
          new = """  const changeQuantity = (value: number) => {
    setDraft((current) => {
      const amounts = calculatedAmounts(current.purchase_category, current.material_id, current.unit, value, current.supplier_id)
      return { ...current, quantity: value, unit_price: amounts.unitPrice, supply_amount: amounts.supplyAmount, vat_amount: amounts.vatAmount, total_amount: amounts.totalAmount }
    })
  }
"""
          if old not in s:
              raise SystemExit('changeAmount block not found')
          s = s.replace(old, new, 1)

          old = """            현재고: <b>{draft.purchase_category === 'RAW_MATERIAL' ? `${integerNumber((selectedMaterial as RawMaterial).current_stock_g)}g` : `${integerNumber((selectedMaterial as PackagingMaterial).current_stock)}EA`}</b>
            {draft.purchase_category === 'RAW_MATERIAL' && (selectedMaterial as RawMaterial).packing_weight_g ? <span> · 1EA 규격 {integerNumber((selectedMaterial as RawMaterial).packing_weight_g)}g</span> : null}
"""
          new = """            현재고: <b>{draft.purchase_category === 'RAW_MATERIAL' ? `${integerNumber((selectedMaterial as RawMaterial).current_stock_g)}g` : `${integerNumber((selectedMaterial as PackagingMaterial).current_stock)}EA`}</b>
            {draft.purchase_category === 'RAW_MATERIAL' && (selectedMaterial as RawMaterial).packing_weight_g ? <span> · 매입 1EA {integerNumber((selectedMaterial as RawMaterial).packing_weight_g)}g</span> : null}
            {draft.purchase_category === 'RAW_MATERIAL' && (selectedMaterial as RawMaterial).unit_price_per_kg ? <span> · 매입단가 {integerNumber((selectedMaterial as RawMaterial).unit_price_per_kg)}원/EA</span> : null}
"""
          if old not in s:
              raise SystemExit('material info block not found')
          s = s.replace(old, new, 1)

          old = """          <Field label=\"입고수량 *\"><input type=\"number\" min=\"0\" step=\"any\" className=\"pr-input\" value={draft.quantity} onChange={(event) => changeAmount('quantity', Number(event.target.value))} /></Field>
"""
          new = """          <Field label=\"입고수량 *\"><input type=\"number\" min=\"0\" step={draft.unit === 'EA' ? '1' : 'any'} className=\"pr-input\" value={draft.quantity} onChange={(event) => changeQuantity(Number(event.target.value))} /></Field>
"""
          if old not in s:
              raise SystemExit('quantity field not found')
          s = s.replace(old, new, 1)

          old = """          <Field label={`단가 / ${draft.unit}`}><input type=\"number\" min=\"0\" step=\"any\" className=\"pr-input\" value={draft.unit_price} onChange={(event) => changeAmount('unit_price', Number(event.target.value))} /></Field>
          <Field label=\"공급가액\"><input type=\"number\" min=\"0\" className=\"pr-input\" value={draft.supply_amount} onChange={(event) => changeAmount('supply_amount', Number(event.target.value))} /></Field>
"""
          new = """          <Field label={`자동 단가 / ${draft.unit}`}><input readOnly className=\"pr-input bg-slate-50 font-black\" value={draft.unit_price} /></Field>
          <Field label=\"자동 공급가액\"><input readOnly className=\"pr-input bg-slate-50 font-black\" value={draft.supply_amount} /></Field>
"""
          if old not in s:
              raise SystemExit('price fields not found')
          s = s.replace(old, new, 1)

          old = """          <Field label=\"부가세\"><input type=\"number\" min=\"0\" className=\"pr-input\" value={draft.vat_amount} onChange={(event) => changeAmount('vat_amount', Number(event.target.value))} /></Field>
"""
          new = """          <Field label=\"자동 부가세\"><input readOnly className=\"pr-input bg-slate-50 font-black\" value={draft.vat_amount} /></Field>
"""
          if old not in s:
              raise SystemExit('vat field not found')
          s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY
      - name: Build
        run: npm run build
      - name: Commit patch
        run: |
          git config user.name "MONI PMO"
          git config user.email "actions@github.com"
          git add src/components/purchase-receipts/types.ts src/components/purchase-receipts/ReceiptEditorModal.tsx
          git commit -m "fix: calculate purchase receipt amounts from material master"
          git push origin HEAD:main
