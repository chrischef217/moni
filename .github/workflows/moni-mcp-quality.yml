name: MONI MCP Quality Gate

on:
  pull_request:
    paths:
      - 'src/lib/moni/mcp/**'
      - 'src/app/mcp/**'
      - 'src/app/oauth/**'
      - 'src/app/.well-known/**'
      - 'src/app/api/moni/mcp-connections/**'
      - 'src/app/api/moni/mcp-activation/**'
      - 'src/app/api/moni/mcp-preflight/**'
      - 'src/app/api/moni/mcp-acceptance-status/**'
      - 'src/components/MoniMcpConnectionsClient.tsx'
      - 'src/components/MoniMcpActivationClient.tsx'
      - 'src/components/MoniMcpPreflightClient.tsx'
      - 'src/components/MoniMcpAcceptanceStatusClient.tsx'
      - 'src/lib/allowance/post-login.ts'
      - 'src/app/api/allowance/auth/login/route.ts'
      - 'src/app/api/allowance/auth/post-login/**'
      - 'src/app/page.tsx'
      - 'supabase/migrations/*moni_mcp*'
      - 'tests/moni-mcp-*.test.mjs'
      - '.github/workflows/moni-mcp-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moni-mcp-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mcp-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-service-role-key
      ALLOWANCE_ENCRYPTION_KEY: build-only-allowance-encryption-key-32
      OPENAI_API_KEY: sk-build-only-not-a-real-secret
      OPENAI_MONI_MODEL: gpt-5
      MONI_BUSINESS_ID: '20220523011'
      MONI_MCP_ENABLED: 'false'
      MONI_PUBLIC_BASE_URL: https://moni-sigma.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify immutable source
        run: npm run prebuild

      - name: MCP contract and security tests
        run: node --test tests/moni-mcp-*.test.mjs

      - name: Production build
        run: npm run build
