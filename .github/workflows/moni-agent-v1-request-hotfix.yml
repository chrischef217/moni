name: MONI Agent V1 request hotfix

on:
  push:
    branches:
      - agent/moni-agent-runtime-v1
    paths:
      - '.github/workflows/moni-agent-v1-request-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/moni-agent-runtime-v1
          fetch-depth: 0
      - name: Patch NextRequest clone type
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/app/api/moni/agent-v2/route.ts')
          s = path.read_text(encoding='utf-8')
          old = "const legacyRequest = request.clone()"
          new = "const legacyRequest = new NextRequest(request.clone())"
          if old not in s:
              raise SystemExit('legacy request anchor not found')
          path.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "MONI PMO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/moni/agent-v2/route.ts
          git commit -m "fix: preserve NextRequest type in agent fallback"
          git push origin HEAD:agent/moni-agent-runtime-v1
