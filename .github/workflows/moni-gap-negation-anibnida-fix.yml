name: MONI Korean Negation Validator Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/moni-gap-negation-anibnida-fix.yml'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/moni-gap-negation-anibnida
          fetch-depth: 0

      - name: Extend safe Korean negation forms
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/moni/agent/sdk-runtime.ts')
          source = path.read_text()
          old = 'const safeNegation = /(?:아니|아님|않|금지|오해|단정하지|표현하지|사용하지|해석하지|의미하지|해당하지|구분)/i'
          new = 'const safeNegation = /(?:아니|아님|아닙|않|금지|오해|단정하지|표현하지|사용하지|해석하지|의미하지|해당하지|구분)/i'
          if old not in source:
            raise SystemExit('safe negation marker not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/moni-gap-negation-anibnida-fix.yml

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/moni/agent/sdk-runtime.ts .github/workflows/moni-gap-negation-anibnida-fix.yml
          git commit -m 'fix: recognize Korean anibnida negation'
          git push origin HEAD:fix/moni-gap-negation-anibnida
