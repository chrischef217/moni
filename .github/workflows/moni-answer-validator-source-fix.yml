name: MONI Answer Validator Source Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/moni-answer-validator-source-fix.yml'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/moni-answer-validator-negation
          fetch-depth: 0

      - name: Apply marker-based source changes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/moni/agent/sdk-runtime.ts')
          source = path.read_text()

          validate_marker = 'function validateAnswer(answer: MoniAnswer, context: MoniRuntimeContext) {'
          helper = '''function hasUnsafeUnaccountedGapInterpretation(answer: MoniAnswer) {
            const segments = [
              answer.conclusion,
              ...answer.metrics.map((metric) => `${metric.label} ${metric.source_field} ${metric.interpretation}`),
              ...answer.sections.flatMap((section) => [section.title, ...section.bullets]),
              ...answer.warnings,
              ...answer.sources.map((source) => source.criteria),
            ]
            const safeNegation = /(?:아니|아님|않|금지|오해|단정하지|표현하지|사용하지|해석하지|의미하지|해당하지|구분)/i
            return segments.some((segment) => {
              if (!/unaccounted_gap_g/i.test(segment) || !/(?:미완료|로스)/.test(segment)) return false
              return !safeNegation.test(segment)
            })
          }

          '''
          if 'function hasUnsafeUnaccountedGapInterpretation' not in source:
            if validate_marker not in source:
              raise SystemExit('validateAnswer marker not found')
            source = source.replace(validate_marker, helper + validate_marker, 1)

          new_check = '''  if (hasUnsafeUnaccountedGapInterpretation(answer)) {
            errors.push('unaccounted_gap_g를 미완료 또는 로스로 잘못 해석함')
          }
          '''
          if 'if (hasUnsafeUnaccountedGapInterpretation(answer))' not in source:
            check_start = source.find('  if (/unaccounted_gap_g')
            check_end_marker = '  return errors\n}'
            check_end = source.find(check_end_marker, check_start)
            if check_start < 0 or check_end < 0:
              raise SystemExit('unaccounted gap validation block not found')
            source = source[:check_start] + new_check + source[check_end:]

          if '  try {\n    const supervisor = new Agent<MoniRuntimeContext' not in source:
            init_start = source.find('  const supervisor = new Agent<MoniRuntimeContext')
            result_marker = '  try {\n    const result = await run(supervisor, currentInput as any, {'
            result_start = source.find(result_marker, init_start)
            if init_start < 0 or result_start < 0:
              raise SystemExit('agent initialization block not found')
            init_block = source[init_start:result_start].rstrip()
            indented = '\n'.join(('  ' + line) if line else line for line in init_block.splitlines())
            replacement = '  try {\n' + indented + '\n    const result = await run(supervisor, currentInput as any, {'
            source = source[:init_start] + replacement + source[result_start + len(result_marker):]

          path.write_text(source)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/moni-answer-validator-source-fix.yml

      - name: Commit source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/moni/agent/sdk-runtime.ts .github/workflows/moni-answer-validator-source-fix.yml
          git commit -m 'fix: distinguish safe unaccounted gap negation'
          git push origin HEAD:fix/moni-answer-validator-negation
