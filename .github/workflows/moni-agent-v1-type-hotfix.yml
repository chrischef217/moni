name: MONI Agent V1 type hotfix

on:
  push:
    branches:
      - agent/moni-agent-runtime-v1
    paths:
      - '.github/workflows/moni-agent-v1-type-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/moni-agent-runtime-v1
          fetch-depth: 0
      - name: Add explicit callback types
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/lib/moni/agent-v2.ts')
          s = path.read_text(encoding='utf-8')
          s = s.replace('(row) =>', '(row: any) =>')
          s = s.replace('(sum, row) =>', '(sum: number, row: any) =>')
          s = s.replace('(a, b) =>', '(a: any, b: any) =>')
          path.write_text(s, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "MONI PMO Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/moni/agent-v2.ts
          git commit -m "fix: add explicit MONI agent callback types"
          git push origin HEAD:agent/moni-agent-runtime-v1
