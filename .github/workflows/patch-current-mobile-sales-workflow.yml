# trigger: apply current mobile sales branch patch
name: Patch Current Mobile Sales Workflow

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/patch-current-mobile-sales-workflow.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-sales-statement-workflow
          fetch-depth: 0

      - name: Stabilize legacy core mobile form rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/MoniMobileBusinessCards.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
            ("type Domain = 'packaging_inbound' | 'production_plan' | 'production_work' | 'sales_order' | 'purchase' | 'payment'",
             "type Domain = 'packaging_inbound' | 'production_plan' | 'production_work' | 'sales_order' | 'sales_statement' | 'purchase' | 'payment'"),
            ("      const next = (payload.card || null) as Card | null\n      if (cardHasFocus('[data-moni-business-card-host=\"true\"]')) return\n",
             "      const next = (payload.card || null) as Card | null\n      if (next && (next.domain === 'sales_statement' || (next.domain === 'sales_order' && next.operation === 'CREATE'))) { setCard(null); activeCardSourceRef.current = ''; return }\n      if (cardHasFocus('[data-moni-business-card-host=\"true\"]')) return\n"),
            ("<CandidateList/><DraftFields/>", "{CandidateList()}{DraftFields()}"),
            (".moni-crud-field{display:block;min-width:0}", ".moni-crud-field{display:block;min-width:0;max-width:100%}"),
            (".moni-biz-item>input{height:42px;border:1px solid #d5e3e0;border-radius:10px;padding:0 8px;font-size:11px}",
             ".moni-biz-item>input{display:block;width:100%;max-width:100%;min-width:0;height:42px;border:1px solid #d5e3e0;border-radius:10px;padding:0 8px;font-size:11px;box-sizing:border-box}"),
            ("@media(max-width:430px){.moni-crud-grid{grid-template-columns:1fr 1fr}.moni-biz-item{grid-template-columns:1fr 1fr}",
             "@media(max-width:430px){.moni-crud-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.moni-biz-item{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}"),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match for {old[:90]!r}, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused mobile sales statement regression
        run: node --test tests/moni-agent-mobile-sales-statement-workflow.test.mjs

      - name: Commit target branch patch
        shell: bash
        run: |
          git config user.name "MONI PMO Patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/MoniMobileBusinessCards.tsx
          git commit -m "Stabilize mobile core form input rendering"
          git push origin HEAD:fix/mobile-sales-statement-workflow
