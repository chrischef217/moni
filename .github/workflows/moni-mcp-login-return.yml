name: MONI MCP Login Return Patch

on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/moni-mcp-login-return.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/moni-chatgpt-mcp-readonly
          fetch-depth: 0
      - name: Patch login return target
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/AllowanceLogin.tsx')
          source = path.read_text()
          old = 'export default function AllowanceLogin() {'
          new = "export default function AllowanceLogin({ returnTo = '' }: { returnTo?: string }) {"
          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit('AllowanceLogin function marker not found')

          old_redirect = """      if (payload.user.role === 'admin') {
        router.replace('/')
      } else {
        router.replace('/freelancer')
      }
      router.refresh()
"""
          new_redirect = """      const safeReturnTo = returnTo.startsWith('/')
        && !returnTo.startsWith('//')
        && !returnTo.includes('\\\\')
        ? returnTo
        : ''
      if (safeReturnTo) {
        router.replace(safeReturnTo)
      } else if (payload.user.role === 'admin') {
        router.replace('/')
      } else {
        router.replace('/freelancer')
      }
      router.refresh()
"""
          if old_redirect in source:
              source = source.replace(old_redirect, new_redirect, 1)
          elif new_redirect not in source:
              raise SystemExit('login redirect block not found')
          path.write_text(source)
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/moni-mcp-login-return.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/AllowanceLogin.tsx .github/workflows/moni-mcp-login-return.yml
          git commit -m 'feat: return MONI login to OAuth consent'
          git push origin HEAD:feat/moni-chatgpt-mcp-readonly
