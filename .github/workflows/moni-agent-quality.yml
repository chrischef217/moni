name: MONI ChatGPT Integration Quality Gate

on:
  pull_request:
    paths:
      - 'src/lib/moni/agent/**'
      - 'src/lib/moni/agent-v2.ts'
      - 'src/lib/moni/chatgpt-actions.ts'
      - 'src/lib/moni/chatgpt-production-actions.ts'
      - 'src/app/api/moni/agent-runtime/**'
      - 'src/app/api/moni/agent-chat/**'
      - 'src/app/api/moni/chat/**'
      - 'src/app/api/moni/chatgpt-only/**'
      - 'src/app/api/moni/agent-evals/**'
      - 'src/app/api/moni/pmo-events/**'
      - 'src/app/chatgpt-actions/**'
      - 'src/components/GlobalMoniAgent.tsx'
      - 'src/app/intelligence/page.tsx'
      - 'src/middleware.ts'
      - 'supabase/migrations/*moni_agent*'
      - 'evals/**'
      - 'tests/moni-agent-*.test.mjs'
      - 'scripts/eval-moni-agent-*.mjs'
      - 'scripts/verify-moni-agent-source.mjs'
      - '.env.example'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/moni-agent-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moni-chatgpt-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chatgpt-integration-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-service-role-key
      ALLOWANCE_ENCRYPTION_KEY: build-only-allowance-encryption-key-32
      MONI_BUSINESS_ID: '20220523011'
      MONI_MCP_ENABLED: 'false'
      MONI_PUBLIC_BASE_URL: https://moni-sigma.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify ChatGPT-only architecture
        run: npm run prebuild

      - name: Agent contract tests
        run: npm run test:agent

      - name: Agent regression evaluation
        run: npm run eval:regression

      - name: Agent security evaluation
        run: npm run eval:security

      - name: Production build
        run: npm run build
