name: Patch Mobile Execution Contracts Branch

on:
  push:
    branches: ["fix/mobile-form-execution-contracts"]
    paths:
      - ".github/mobile-execution-contracts-trigger"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-form-execution-contracts
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-mobile-execution-contracts.py
      - name: Run focused regressions
        run: |
          npm ci --no-audit --no-fund
          node --test tests/moni-agent-mobile-execution-contracts.test.mjs tests/moni-agent-mobile-intent-matrix.test.mjs
      - name: Commit fixed application code
        shell: bash
        run: |
          git config user.name "MONI PMO Patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/api/moni/mobile-extended-actions/route.ts src/lib/moni/mobile-extended-intents.ts tests/moni-agent-mobile-intent-matrix.test.mjs
          git commit -m "Fix mobile extended form execution contracts"
          git push origin HEAD:fix/mobile-form-execution-contracts
