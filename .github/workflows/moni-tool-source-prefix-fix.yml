name: MONI Tool Source Prefix Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/moni-tool-source-prefix-fix.yml'

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/moni-tool-source-prefix-normalization
          fetch-depth: 0

      - name: Apply exact source and regression changes
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('src/lib/moni/agent/sdk-runtime.ts')
          runtime = runtime_path.read_text()

          marker = 'function getPath(value: unknown, path: string): unknown {'
          helper = '''function canonicalToolName(value: string) {
            return String(value || '').trim().replace(/^(?:functions?\\.)+/i, '')
          }

          function normalizeAnswerToolReferences(answer: MoniAnswer): MoniAnswer {
            return {
              ...answer,
              metrics: answer.metrics.map((metric) => ({
                ...metric,
                source_tool: canonicalToolName(metric.source_tool),
              })),
              sources: answer.sources.map((source) => ({
                ...source,
                tool: canonicalToolName(source.tool),
              })),
            }
          }

          '''
          if 'function canonicalToolName' not in runtime:
            if marker not in runtime:
              raise SystemExit('getPath marker not found')
            runtime = runtime.replace(marker, helper + marker, 1)

          replacements = [
            (
              '  const used = new Set(context.toolsUsed)',
              '  const used = new Set(context.toolsUsed.map(canonicalToolName))',
              'toolsUsed normalization marker not found',
            ),
            (
              '    if (!used.has(source.tool)) errors.push(`사용하지 않은 도구를 출처로 표시함: ${source.tool}`)',
              '    const sourceTool = canonicalToolName(source.tool)\n    if (!used.has(sourceTool)) errors.push(`사용하지 않은 도구를 출처로 표시함: ${sourceTool}`)',
              'source validation marker not found',
            ),
            (
              '    const outputs = context.toolOutputs.get(metric.source_tool) || []',
              '    const sourceTool = canonicalToolName(metric.source_tool)\n    const outputs = context.toolOutputs.get(sourceTool) || []',
              'metric output lookup marker not found',
            ),
            (
              '      errors.push(`수치 출처 도구 결과 없음: ${metric.source_tool}`)',
              '      errors.push(`수치 출처 도구 결과 없음: ${sourceTool}`)',
              'metric source error marker not found',
            ),
            (
              '    const answer = MoniAnswerSchema.parse(result.finalOutput)',
              '    const answer = normalizeAnswerToolReferences(MoniAnswerSchema.parse(result.finalOutput))',
              'answer normalization marker not found',
            ),
            (
              '13. 실제로 사용하지 않은 도구를 sources에 적지 않습니다.',
              '13. 실제로 사용하지 않은 도구를 sources에 적지 않습니다. sources.tool과 metrics.source_tool에는 functions. 같은 접두어 없이 실제 도구 이름만 적습니다.',
              'tool source instruction marker not found',
            ),
          ]
          for old, new, error in replacements:
            if old in runtime:
              runtime = runtime.replace(old, new, 1)
            elif new not in runtime:
              raise SystemExit(error)

          runtime_path.write_text(runtime)

          live_eval_path = Path('src/lib/moni/agent/live-eval.ts')
          live_eval = live_eval_path.read_text()
          allow_marker = "  'production-month-summary',\n"
          allow_insert = "  'production-month-summary',\n  'relative-date-clock',\n"
          if "  'relative-date-clock',\n" not in live_eval:
            if allow_marker not in live_eval:
              raise SystemExit('live safe case marker not found')
            live_eval = live_eval.replace(allow_marker, allow_insert, 1)
          live_eval_path.write_text(live_eval)

          test_path = Path('tests/moni-agent-foundation.test.mjs')
          tests = test_path.read_text()
          test_marker = "test('runtime validates evidence-backed metrics and period', () => {"
          new_test = '''test('tool source namespace prefixes normalize before validation and rendering', () => {
            assert.match(runtime, /function canonicalToolName/)
            assert.match(runtime, /function normalizeAnswerToolReferences/)
            assert.match(runtime, /context\\.toolsUsed\\.map\\(canonicalToolName\\)/)
            assert.match(runtime, /normalizeAnswerToolReferences\\(MoniAnswerSchema\\.parse\\(result\\.finalOutput\\)\\)/)
            assert.match(runtime, /source_tool: canonicalToolName\\(metric\\.source_tool\\)/)
            assert.match(runtime, /tool: canonicalToolName\\(source\\.tool\\)/)
          })

          '''
          if "tool source namespace prefixes normalize" not in tests:
            if test_marker not in tests:
              raise SystemExit('foundation test marker not found')
            tests = tests.replace(test_marker, new_test + test_marker, 1)
          test_path.write_text(tests)

          verify_path = Path('scripts/verify-moni-agent-source.mjs')
          verify = verify_path.read_text()
          verify_marker = "if (!runtime.includes('outputType: MoniAnswerSchema')) failures.push('MONI runtime must use a structured final output schema')"
          verify_add = verify_marker + "\nif (!runtime.includes('function canonicalToolName') || !runtime.includes('normalizeAnswerToolReferences(MoniAnswerSchema.parse')) failures.push('tool source namespace normalization is missing')\nif (!runtime.includes('context.toolsUsed.map(canonicalToolName)')) failures.push('used tool validation is not canonicalized')\nif (!liveEval.includes(\"'relative-date-clock'\")) failures.push('relative-date production canary is not in the safe allowlist')"
          if 'tool source namespace normalization is missing' not in verify:
            if verify_marker not in verify:
              raise SystemExit('source verification marker not found')
            verify = verify.replace(verify_marker, verify_add, 1)
          verify_path.write_text(verify)

          security_path = Path('scripts/eval-moni-agent-security.mjs')
          security = security_path.read_text()
          security_marker = "if (!runtime.includes('시스템 명령, SQL, 비밀키')) failures.push('sensitive output prohibition is missing')"
          security_add = security_marker + "\nif (!runtime.includes('function canonicalToolName') || !runtime.includes('normalizeAnswerToolReferences(MoniAnswerSchema.parse')) failures.push('tool source namespace normalization is missing')\nif (!runtime.includes('context.toolsUsed.map(canonicalToolName)')) failures.push('tool source validation bypasses canonical names')\nif (!liveEval.includes(\"'relative-date-clock'\")) failures.push('relative-date live canary is not allowlisted')"
          if 'tool source validation bypasses canonical names' not in security:
            if security_marker not in security:
              raise SystemExit('security evaluation marker not found')
            security = security.replace(security_marker, security_add, 1)
          security_path.write_text(security)
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/moni-tool-source-prefix-fix.yml

      - name: Commit normalized source validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/moni/agent/sdk-runtime.ts src/lib/moni/agent/live-eval.ts tests/moni-agent-foundation.test.mjs scripts/verify-moni-agent-source.mjs scripts/eval-moni-agent-security.mjs .github/workflows/moni-tool-source-prefix-fix.yml
          git commit -m 'fix: normalize MONI tool source namespace prefixes'
          git push origin HEAD:fix/moni-tool-source-prefix-normalization
