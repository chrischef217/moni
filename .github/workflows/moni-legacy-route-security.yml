name: MONI Legacy Route Security Gate

on:
  pull_request:
    paths:
      - 'src/app/api/cron/morning-check/**'
      - 'src/app/api/export/excel/**'
      - 'src/app/api/export/report/**'
      - 'src/lib/stock_alert_engine.ts'
      - 'tests/legacy-route-security.test.mjs'
      - '.github/workflows/moni-legacy-route-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-anon-key
      SUPABASE_SERVICE_ROLE_KEY: build-only-service-role-key
      ALLOWANCE_ENCRYPTION_KEY: build-only-allowance-encryption-key-32
      OPENAI_API_KEY: sk-build-only-not-a-real-secret
      OPENAI_MONI_MODEL: gpt-5
      MONI_BUSINESS_ID: '20220523011'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify immutable source
        run: npm run prebuild
      - name: Legacy route security tests
        run: node --test tests/legacy-route-security.test.mjs
      - name: Production build
        run: npm run build
