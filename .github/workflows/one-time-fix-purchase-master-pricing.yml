name: One-time fix purchase master pricing

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-purchase-master-pricing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply purchase pricing repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              content = file.read_text(encoding='utf-8')
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              file.write_text(content.replace(old, new, 1), encoding='utf-8')

          # Types: expose the raw-material master fields used by the receipt editor.
          replace_once(
              'src/components/purchase-receipts/types.ts',
              "  country_of_origin?: string | null\n  packing_weight_g?: number | null\n",
              "  country_of_origin?: string | null\n  spec?: string | null\n  packing_unit?: string | null\n  packing_weight_g?: number | null\n",
          )

          modal = 'src/components/purchase-receipts/ReceiptEditorModal.tsx'
          replace_once(
              modal,
              "import { integerNumber, normalize, rawMaterialName } from './utils'\n",
              "import { integerNumber, normalize, rawMaterialName } from './utils'\nimport { derivePackagingPurchasePricing, deriveRawPurchasePricing, type MasterPurchasePricing } from '@/lib/moni/purchasePricing'\n",
          )
          replace_once(
              modal,
              "function Field({ label, children }: { label: string; children: React.ReactNode }) {\n  return <label className=\"block\"><span className=\"mb-1.5 block text-xs font-black text-[#607d8d]\">{label}</span>{children}</label>\n}\n",
              "function Field({ label, children }: { label: string; children: React.ReactNode }) {\n  return <label className=\"block\"><span className=\"mb-1.5 block text-xs font-black text-[#607d8d]\">{label}</span>{children}</label>\n}\n\nfunction formatNumber(value: number, maximumFractionDigits = 2) {\n  return new Intl.NumberFormat('ko-KR', { maximumFractionDigits }).format(Number(value || 0))\n}\n",
          )
          replace_once(
              modal,
              """  const priceFor = (category: PurchaseCategory, materialId: string, unit: PurchaseUnit) => {
    if (category === 'PACKAGING') return Number(packagingMaterials.find((row) => row.id === materialId || row.material_code === materialId)?.unit_price ?? 0)
    const raw = rawMaterials.find((row) => row.id === materialId || row.item_code === materialId)
    const perKg = Number(raw?.unit_price_per_kg ?? 0)
    if (unit === 'G') return perKg / 1000
    if (unit === 'EA') return perKg * Number(raw?.packing_weight_g ?? 0) / 1000
    return perKg
  }
""",
              """  const calculatePricing = (
    category: PurchaseCategory,
    materialId: string,
    unit: PurchaseUnit,
    quantity: number,
  ): MasterPurchasePricing => {
    if (category === 'PACKAGING') {
      const material = packagingMaterials.find((row) => row.id === materialId || row.material_code === materialId)
      return derivePackagingPurchasePricing({ quantity, unitPrice: Number(material?.unit_price ?? 0) })
    }
    const material = rawMaterials.find((row) => row.id === materialId || row.item_code === materialId)
    return deriveRawPurchasePricing({
      quantity,
      unit,
      packingWeightG: Number(material?.packing_weight_g ?? 0),
      packagePrice: Number(material?.unit_price_per_kg ?? 0),
    })
  }

  const safePricing = (category: PurchaseCategory, materialId: string, unit: PurchaseUnit, quantity: number) => {
    if (!materialId) return null
    try {
      return calculatePricing(category, materialId, unit, quantity)
    } catch {
      return null
    }
  }

  let selectedPricing: MasterPurchasePricing | null = null
  let selectedPricingError = ''
  if (draft.material_id) {
    try {
      selectedPricing = calculatePricing(draft.purchase_category, draft.material_id, draft.unit, Number(draft.quantity || 0))
    } catch (reason) {
      selectedPricingError = reason instanceof Error ? reason.message : '기준 단가를 계산하지 못했습니다.'
    }
  }
""",
          )
          replace_once(
              modal,
              """  const changeUnit = (unit: PurchaseUnit) => {
    setDraft((current) => {
      const unitPrice = priceFor(current.purchase_category, current.material_id, unit)
      const supplyAmount = Number(current.quantity || 0) * unitPrice
      return { ...current, unit, unit_price: unitPrice, supply_amount: supplyAmount, total_amount: supplyAmount + Number(current.vat_amount || 0) }
    })
  }

  const selectMaterial = (materialId: string) => {
    setDraft((current) => {
      const unitPrice = priceFor(current.purchase_category, materialId, current.unit)
      const supplyAmount = Number(current.quantity || 0) * unitPrice
      return { ...current, material_id: materialId, unit_price: unitPrice, supply_amount: supplyAmount, total_amount: supplyAmount + Number(current.vat_amount || 0) }
    })
  }
""",
              """  const changeUnit = (unit: PurchaseUnit) => {
    setDraft((current) => {
      const pricing = safePricing(current.purchase_category, current.material_id, unit, Number(current.quantity || 0))
      const supplyAmount = pricing?.supplyAmount ?? 0
