name: One-time fix purchase master pricing

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-purchase-master-pricing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified patch
        run: python scripts/one_time_fix_purchase_pricing.py
      - name: Commit repair
        run: |
          git config user.name "MONI PMO"
          git config user.email "actions@github.com"
          git add src/components/purchase-receipts/types.ts \
                  src/components/purchase-receipts/ReceiptEditorModal.tsx \
                  src/components/PurchaseReceiptManagementModule.tsx \
                  src/app/api/moni/purchases/route.ts \
                  src/app/api/moni/purchase-receipts/route.ts
          git commit -m "fix: enforce master-based purchase pricing end to end"
          git push origin HEAD:main
