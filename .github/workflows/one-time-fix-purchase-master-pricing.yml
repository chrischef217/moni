      { 매입처: '등록된 매입처명', 구분: '부재료', 품목: '등록된 부재료명', 수량: 100, 단위: 'EA', 매입일: initialToday, 입고일: initialToday, 단가: 100, 공급가액: 10000, 부가세: 1000, 지급예정일: '', 결제수단: '카드', '계좌/카드': '법인카드 별칭', 할부개월: 3, 비고: '' },
""",
