    setDraft((current) => {
      const pricing = safePricing(current.purchase_category, materialId, current.unit, Number(current.quantity || 0))
      const supplyAmount = pricing?.supplyAmount ?? 0
      return {
        ...current,
        material_id: materialId,
        unit_price: pricing?.unitPrice ?? 0,
        supply_amount: supplyAmount,
        total_amount: supplyAmount + Number(current.vat_amount || 0),
      }
    })
  }
""",
          )
