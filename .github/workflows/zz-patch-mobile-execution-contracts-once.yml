name: One-shot Mobile Execution Contract Patch

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/zz-patch-mobile-execution-contracts-once.yml"

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-form-execution-contracts
          fetch-depth: 0

      - name: Patch mobile execution contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('src/app/api/moni/mobile-extended-actions/route.ts')
          text = route.read_text(encoding='utf-8')

          old = "const [products, units, recipes, raw, packaging, clients, people, opportunities, orders, receipts, variants, terms, sanitation, adjustments] = await Promise.all(["
          new = "const [products, units, recipes, raw, packaging, clients, people, opportunities, activities, workLogs, orders, receipts, variants, terms, sanitation, adjustments] = await Promise.all(["
          if text.count(old) != 1: raise SystemExit(f'catalog declaration count={text.count(old)}')
          text = text.replace(old, new)

          old = """    db.from('sales_opportunities').select('*').eq('business_id', BUSINESS_ID).order('created_at', { ascending: false }).limit(150),
    db.from('sales_orders').select('id,statement_number,sale_date,client_id,status,total_amount,due_date,payment_status').eq('business_id', BUSINESS_ID).order('sale_date', { ascending: false }).limit(150),
"""
          new = """    db.from('sales_opportunities').select('*').eq('business_id', BUSINESS_ID).order('created_at', { ascending: false }).limit(150),
    db.from('sales_activities').select('*').eq('business_id', BUSINESS_ID).order('activity_date', { ascending: false }).limit(150),
    db.from('freelancer_work_logs').select('*').eq('business_id', BUSINESS_ID).order('work_date', { ascending: false }).limit(150),
    db.from('sales_orders').select('id,statement_number,sale_date,client_id,status,total_amount,due_date,payment_status').eq('business_id', BUSINESS_ID).order('sale_date', { ascending: false }).limit(150),
"""
          if text.count(old) != 1: raise SystemExit(f'catalog queries count={text.count(old)}')
          text = text.replace(old, new)

          old = "const all = [products, units, recipes, raw, packaging, clients, people, opportunities, orders, receipts, variants, terms, sanitation, adjustments]"
          new = "const all = [products, units, recipes, raw, packaging, clients, people, opportunities, activities, workLogs, orders, receipts, variants, terms, sanitation, adjustments]"
          if text.count(old) != 1: raise SystemExit(f'catalog all count={text.count(old)}')
          text = text.replace(old, new)

          old = """    clients: clients.data ?? [], people: people.data ?? [], opportunities: opportunities.data ?? [], orders: orders.data ?? [], receipts: receipts.data ?? [],
    variants: variants.data ?? [], terms: terms.data ?? [], sanitation: sanitation.data ?? [], adjustments: adjustments.data ?? [],
"""
          new = """    clients: clients.data ?? [], people: people.data ?? [], opportunities: opportunities.data ?? [], activities: activities.data ?? [], workLogs: workLogs.data ?? [], orders: orders.data ?? [], receipts: receipts.data ?? [],
    variants: variants.data ?? [], terms: terms.data ?? [], sanitation: sanitation.data ?? [], adjustments: adjustments.data ?? [],
"""
          if text.count(old) != 1: raise SystemExit(f'catalog return count={text.count(old)}')
          text = text.replace(old, new)

          old = """  if (intent.domain === 'business_activity') {
    return { ...base,title:'영업활동·상담기록',schema:[field('client_id','고객사','select',matchedClient?.id || '',{options:[option('','미지정'),...clientOptions]}),field('opportunity_id','영업기회','select','',{options:[option('','미지정'),...c.opportunities.map((row:any)=>option(row.id,row.title,row.stage))]}),field('activity_date','활동일','date',today(),{required:true}),field('activity_type','활동유형','text','상담'),field('summary','활동내용','textarea','',{required:true}),field('next_action','다음 행동','text',''),field('next_action_date','다음 행동일','date',''),field('assigned_person_id','담당 영업','select',matchedPerson?.id || '',{options:[option('','미지정'),...personOptions]})],candidates:[] }
  }

