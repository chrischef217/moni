name: One-shot Mobile Intent Matrix Branch Patch

# Triggered once after workflow registration on default branch.
on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/zz-patch-mobile-intent-matrix-once.yml"

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-form-intent-matrix
          fetch-depth: 0

      - name: Patch intent precedence, card copy, and packaging tenant scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/moni/mobile-extended-intents.ts')
          text = path.read_text(encoding='utf-8')
          person = """  if (has(value, /(?:프리랜서|인력|직원)/) && writeCue) {\n    const op = mutation(value)\n    return op ? { domain: 'business_person', operation: op } : null\n  }\n\n"""
          work = """  if (has(value, /(?:작업시간|근무시간|작업일지|근무일지)/) && has(value, /(?:프리랜서|생산|인력|근무|작업)/) && writeCue) {\n    const op = mutation(value)\n    return op ? { domain: 'business_work_log', operation: op } : null\n  }\n\n"""
          if text.count(person) != 1 or text.count(work) != 1:
              raise SystemExit(f'extended intent blocks person={text.count(person)} work={text.count(work)}')
          text = text.replace(person, '').replace(work, work + person)
          path.write_text(text, encoding='utf-8')

          path = Path('src/lib/moni/mobile-business-intents.ts')
          text = path.read_text(encoding='utf-8')
          old = """  const op = intent.operation === 'CREATE' ? '입력' : intent.operation === 'UPDATE' ? '수정' : intent.operation === 'DELETE' || intent.operation === 'CANCEL' ? '취소·삭제' : intent.operation === 'COMPLETE' ? '완료' : '확정'\n  return `${labels[intent.domain]} ${op} 카드를 열었습니다. 필요한 값을 확인·수정한 뒤 ‘입력 내용 확인’을 눌러 주세요.`\n"""
          new = """  const op = intent.operation === 'CREATE' ? '입력' : intent.operation === 'UPDATE' ? '수정' : intent.operation === 'DELETE' || intent.operation === 'CANCEL' ? '취소·삭제' : intent.operation === 'COMPLETE' ? '완료' : '확정'\n  const actionLabel = intent.operation === 'CREATE' ? '입력 내용 확인' : intent.operation === 'UPDATE' ? '변경 내용 확인' : intent.operation === 'DELETE' ? '삭제 내용 확인' : intent.operation === 'CANCEL' ? '취소 내용 확인' : intent.operation === 'COMPLETE' ? '완료 내용 확인' : '확정 내용 확인'\n  return `${labels[intent.domain]} ${op} 카드를 열었습니다. 필요한 값을 확인·수정한 뒤 ‘${actionLabel}’을 눌러 주세요.`\n"""
          if text.count(old) != 1:
              raise SystemExit(f'business card guidance pattern count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')

          path = Path('src/components/MoniMobileBusinessCards.tsx')
          text = path.read_text(encoding='utf-8')
          marker = "function SearchSelect({ value, options, placeholder, onSelect, disabled = false }:"
          helper = """function prepareButtonLabel(operation: Operation) {\n  if (operation === 'UPDATE') return '변경 내용 확인'\n  if (operation === 'DELETE') return '삭제 내용 확인'\n  if (operation === 'CANCEL') return '취소 내용 확인'\n  if (operation === 'COMPLETE') return '완료 내용 확인'\n  if (operation === 'CONFIRM') return '확정 내용 확인'\n  return '입력 내용 확인'\n}\n\n"""
          if text.count(marker) != 1:
              raise SystemExit(f'business card helper marker count={text.count(marker)}')
          if 'function prepareButtonLabel(operation: Operation)' not in text:
              text = text.replace(marker, helper + marker)
          old_button = "{busy ? '확인 중…' : '입력 내용 확인'}</button>"
          new_button = "{busy ? '확인 중…' : prepareButtonLabel(card.operation)}</button>"
          if text.count(old_button) != 1:
              raise SystemExit(f'business card button pattern count={text.count(old_button)}')
          path.write_text(text.replace(old_button, new_button), encoding='utf-8')

          path = Path('src/app/api/moni/packaging-materials/route.ts')
          text = path.read_text(encoding='utf-8')
          old = """      .from('packaging_materials')\n      .select('*')\n      .order('material_name', { ascending: true })\n"""
          new = """      .from('packaging_materials')\n      .select('*')\n      .eq('business_id', CANONICAL_MONI_BUSINESS_ID)\n      .order('material_name', { ascending: true })\n"""
          if text.count(old) != 1:
              raise SystemExit(f'packaging list scope pattern count={text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run executable intent matrix
        run: |
          npm ci --no-audit --no-fund
          node --test tests/moni-agent-mobile-intent-matrix.test.mjs

      - name: Commit branch fix
        shell: bash
        run: |
          git config user.name "MONI PMO Patch"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/moni/mobile-extended-intents.ts src/lib/moni/mobile-business-intents.ts src/components/MoniMobileBusinessCards.tsx src/app/api/moni/packaging-materials/route.ts
          git commit -m "Fix mobile form intent precedence and tenant scope"
          git push origin HEAD:fix/mobile-form-intent-matrix
