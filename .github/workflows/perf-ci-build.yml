name: MONI Performance CI

on:
  push:
    branches:
      - 'perf/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://nvzxlejpmsfzbpprgvfh.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-key
      ALLOWANCE_ENCRYPTION_KEY: ci-placeholder-encryption-key
      GOOGLE_AI_API_KEY: ci-placeholder-google-key
      GEMINI_MODEL: gemini-2.5-flash
      MFDS_API_KEY: ci-placeholder-mfds-key
      MFDS_COMPANY_ID: ci-placeholder-company
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
